name: Deploy Pages
on:
  push:
    branches: [main]
  # GITHUB_TOKEN による push では push イベントが起きないので、日次更新の完了でも走らせる
  workflow_run:
    workflows: [Update prices]
    types: [completed]
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with: { ref: main }
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          check-latest: true
          cache: npm
      - run: npm ci --no-audit
      - run: npm run build
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1

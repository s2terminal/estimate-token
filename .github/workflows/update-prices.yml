name: Update prices
on:
  schedule: [{ cron: "17 21 * * *" }] # 06:17 JST
  workflow_dispatch:
    inputs:
      force_stop:
        description: "品質ゲートで止めた扱いにする(PR作成の動作確認用)"
        type: boolean
        default: false
permissions:
  contents: write
  pull-requests: write
  issues: write
concurrency:
  group: update-prices
  cancel-in-progress: false
env:
  LOG_ISSUE_TITLE: 価格更新ログ
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # 起動待ち・再実行中に main が進んでも、古いイベント SHA から生成しない。
        with: { ref: main }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          check-latest: true
          cache: npm
      - run: npm ci --no-audit

      # 前回の正常rawを維持し、片方の取得障害でも提供条件を変えない。
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            raw/litellm.json
            raw/litellm.meta.json
            raw/models-dev.catalog.json
            raw/models-dev.meta.json
          key: prices-raw-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: prices-raw-

      - id: pipeline
        name: Pipeline (fetch → select → normalize → cross-check → validate → diff)
        run: npm run pipeline -- ${{ inputs.force_stop && '--force-stop' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm run check

      # OpenRouter の生データは規約上再配布しないため artifact に含めない
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: raw-${{ github.run_id }}
          path: |
            raw/litellm.json
            raw/litellm.meta.json
            raw/models-dev.catalog.json
            raw/models-dev.meta.json
            raw/fx.json
            raw/gemini-pricing.txt
            raw/gemini-pricing.meta.json
            out/
          retention-days: 14

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: |
            raw/litellm.json
            raw/litellm.meta.json
            raw/models-dev.catalog.json
            raw/models-dev.meta.json
          key: prices-raw-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Publish (gate passed → commit to main)
        if: steps.pipeline.outputs.status == 'pass' && steps.pipeline.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/latest.json
          git commit -m "chore(data): 価格データを更新 ${{ steps.pipeline.outputs.snapshot }}"
          git push origin HEAD:main

      # 止めた理由が同じなら新しいPRは作らない: 開いているPRは最新データで更新し、閉じたPRは作り直さずIssueに記録する
      - id: hold
        name: Hold (gate stopped → open or update a PR)
        if: steps.pipeline.outputs.status == 'stop' && steps.pipeline.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SNAPSHOT: ${{ steps.pipeline.outputs.snapshot }}
          STOP_KEY: ${{ steps.pipeline.outputs.stop_key }}
        run: |
          branch="prices/hold-$STOP_KEY"
          title="価格データの更新を止めました($SNAPSHOT)"
          read -r num state < <(gh pr list --state all --head "$branch" --limit 1 --json number,state \
            --jq '.[0] // empty | "\(.number) \(.state)"') || true
          if [ -n "${state:-}" ] && [ "$state" != "OPEN" ]; then
            echo "同じ理由のPR #$num は $state のため作り直しません"
            echo "result=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add public/data/latest.json
          git commit -m "chore(data): 価格データの更新(要確認) $SNAPSHOT"
          git push --force origin "$branch"
          if [ -n "${num:-}" ]; then
            gh pr edit "$num" --title "$title" --body-file out/report.md
            echo "result=updated" >> "$GITHUB_OUTPUT"
          else
            gh pr create --base main --head "$branch" --title "$title" --body-file out/report.md
            echo "result=created" >> "$GITHUB_OUTPUT"
          fi

      - name: Log notes or unchanged gate failure to issue
        if: (steps.pipeline.outputs.status == 'pass' && steps.pipeline.outputs.notes == 'true') || (steps.pipeline.outputs.status == 'stop' && (steps.pipeline.outputs.changed == 'false' || steps.hold.outputs.result == 'skipped'))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # --search は検索インデックス経由で反映が遅れるため使わず、一覧をタイトル完全一致で絞る
          num=$(gh issue list --state open --limit 200 --json number,title \
            --jq "map(select(.title == env.LOG_ISSUE_TITLE)) | .[0].number // empty")
          if [ -z "$num" ]; then
            # gh issue create は作った Issue の URL を出力するので、末尾の番号を使う
            url=$(gh issue create --title "$LOG_ISSUE_TITLE" --body "日次の価格更新で記録すべきこと(値変わり・照合の不一致など)をここにコメントします。")
            num=${url##*/}
          fi
          gh issue comment "$num" --body-file out/report.md

      - name: Log failure to issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # --search は検索インデックス経由で反映が遅れるため使わず、一覧をタイトル完全一致で絞る
          num=$(gh issue list --state open --limit 200 --json number,title \
            --jq "map(select(.title == env.LOG_ISSUE_TITLE)) | .[0].number // empty")
          [ -n "$num" ] && gh issue comment "$num" --body "日次更新が失敗しました: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true

      - name: Notify Slack (Incoming Webhook)
        if: always()
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
          PIPELINE_STATUS: ${{ steps.pipeline.outputs.status }}
          CHANGED: ${{ steps.pipeline.outputs.changed }}
          HAS_NOTES: ${{ steps.pipeline.outputs.notes }}
          SNAPSHOT: ${{ steps.pipeline.outputs.snapshot }}
          HOLD_RESULT: ${{ steps.hold.outputs.result }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL is not configured; skipping Slack notification."
            exit 0
          fi

          if [ "$JOB_STATUS" = "failure" ]; then
            result="❌ 日次の価格更新が失敗しました。"
          elif [ "$JOB_STATUS" = "cancelled" ]; then
            result="⏹️ 日次の価格更新がキャンセルされました。"
          elif [ "$PIPELINE_STATUS" = "stop" ]; then
            result="⚠️ 品質ゲートで価格更新を停止しました。"
            case "$HOLD_RESULT" in
              created) result="$result 確認用PRを作成しました。" ;;
              updated) result="$result 同じ理由の確認用PRを更新しました。" ;;
              skipped) result="$result 同じ理由のPRは閉じられているため作り直していません。" ;;
            esac
          elif [ "$CHANGED" = "true" ]; then
            result="✅ 日次の価格更新をmainへ反映しました。"
          else
            result="✅ 日次の価格更新が完了しました（変更なし）。"
          fi

          if [ "$HAS_NOTES" = "true" ]; then
            result="$result 要確認の記録があります（Actionsのレポートを参照）。"
          fi
          payload=$(jq -n --arg result "$result" --arg repository "$REPOSITORY" \
            --arg snapshot "$SNAPSHOT" --arg url "$RUN_URL" \
            '{text: ($result + "\nリポジトリ: " + $repository + (if $snapshot == "" then "" else "\n対象日: " + $snapshot end) + "\n実行ログ: " + $url)}')
          curl --fail --silent --show-error --connect-timeout 5 --max-time 15 \
            --header 'Content-Type: application/json' --data "$payload" \
            --output /dev/null "$SLACK_WEBHOOK_URL"

# 対象エントリの選別規則とキーの解析規則。
# 規則に合う新モデルは設定変更なしで自動的に取り込まれる。

# LiteLLM の litellm_provider → platform
providers:
  openai: openai
  anthropic: anthropic
  gemini: gemini-api
  vertex_ai: vertex-ai
  vertex_ai-language-models: vertex-ai
  vertex_ai-anthropic_models: vertex-ai
  vertex_ai-mistral_models: vertex-ai
  vertex_ai-llama_models: vertex-ai
  vertex_ai-deepseek_models: vertex-ai
  vertex_ai-openai_models: vertex-ai
  vertex_ai-qwen_models: vertex-ai
  bedrock: bedrock
  bedrock_converse: bedrock
  azure: azure
  azure_ai: azure

modes: [chat, responses, image_generation]

# 一致したキーは捨てる(画質・サイズ別の画像キー、Bedrockの予約購入、ファインチューニングなど)
excludeKeyPatterns:
  - "(^|/)(low|medium|high|hd|standard|max)/"
  - "\\d+-x-\\d+/"
  - "commitment"
  - "^ft:"
  - "(^|/)(us-gov-|cn-|ap-|eu-|us-|ca-|sa-|me-|af-)[a-z]+-\\d/.*commitment"
  - "-search-preview"
  - "realtime"
  - "audio"
  - "tts"
  - "transcribe"

# 系列名 → 開発元(上から順に評価)
vendors:
  - { pattern: "^(claude|anthropic)", vendor: Anthropic }
  - { pattern: "^(gpt|o\\d|chatgpt|dall-e|codex|davinci|babbage)", vendor: OpenAI }
  - { pattern: "^(gemini|gemma|imagen|nano-banana|learnlm)", vendor: Google }
  - { pattern: "^(nova|titan|amazon)", vendor: Amazon }
  - { pattern: "^(mistral|mixtral|codestral|ministral|magistral|pixtral|devstral)", vendor: Mistral }
  - { pattern: "^(llama|meta)", vendor: Meta }
  - { pattern: "^deepseek", vendor: DeepSeek }
  - { pattern: "^(qwen)", vendor: Alibaba }
  - { pattern: "^(command|cohere)", vendor: Cohere }
  - { pattern: "^(jamba|j2)", vendor: AI21 }
  - { pattern: "^(grok)", vendor: xAI }
  - { pattern: "^(stable|sd3|stability)", vendor: Stability AI }

# 自動生成の表示名を上書きしたいとき(系列名 → 表示名)
names:
  gemini-nano-banana-2.1: Nano Banana 2.1

# 初期選択: 同じ用途の系列から最新を1件。提供先・リージョン違いは重複選択しない。
# release_date が取得できれば新しい日付を優先。不明な場合は数値バージョンで比較。
# preview / latest / 特化モデルは、規則で明示したもの以外は候補に含めない。
recommendations:
  # 言語: 高性能・バランス・低コストの違いは残す
  - { category: llm, vendor: OpenAI, pattern: '^gpt-[0-9.]+-astra$' }
  - { category: llm, vendor: OpenAI, pattern: '^gpt-[0-9.]+-sol$' }
  - { category: llm, vendor: OpenAI, pattern: '^gpt-[0-9.]+-luna$' }
  - { category: llm, vendor: Anthropic, pattern: '^claude-opus-[0-9-]+$' }
  - { category: llm, vendor: Anthropic, pattern: '^claude-sonnet-[0-9-]+$' }
  - { category: llm, vendor: Anthropic, pattern: '^claude-haiku-[0-9-]+$' }
  - { category: llm, vendor: Google, pattern: '^gemini-[0-9.]+-pro(-preview)?$' }
  - { category: llm, vendor: Google, pattern: '^gemini-[0-9.]+-flash$' }
  - { category: llm, vendor: Google, pattern: '^gemini-[0-9.]+-flash-lite$' }
  # 画像: 後継のSunburstと旧GPT Imageを同じ枠で比較。Flareなど別系列は残す
  - { category: image, vendor: OpenAI, pattern: '^gpt-image-[0-9.]+(-sunburst)?$' }
  - { category: image, vendor: OpenAI, pattern: '^gpt-image-[0-9.]+-flare$' }
  - { category: image, vendor: Google, pattern: '^gemini-nano-banana-[0-9.]+$' }
  - { category: image, vendor: Google, pattern: '^gemini-[0-9.]+-flash-image$' }
  - { category: image, vendor: Google, pattern: '^gemini-[0-9.]+-pro-image$' }
  - { category: image, vendor: Google, pattern: '^gemini-[0-9.]+-flash-lite-image$' }
